# The workload cli_test.go runs against testdata/custombin. It declares no
# MCP servers: its one tool comes from the binary (cli.WithTools), and it
# does not classify that tool, so mast treats apply_change as mutating and
# the default on_mutation policy parks the call.
name: custom-tools
description: Fixture for the custom main.go test.
mode: single_session
specialists:
  - worker
budget:
  max_wallclock_seconds: 120
