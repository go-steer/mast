#
# Anchor workload for the mast v0.1 GKE triage demo.
# See docs (in the mast repo): triage-demo-plan.md.

name: gke-triage
description: Autonomous triage of GKE cluster incidents surfaced by k8s-event-watcher.
mode: single_session

tool_catalog:
  mcp:
    - server: gke

specialists:
  - triage-classifier
  - ImagePullBackOff
  - _fallback

budget:
  max_wallclock_seconds: 300
  # max_turns: 20  # cap on model calls ("turns") per session; absent/0 = unlimited

# Change-safety-gate stand-in (spike 2): every specialist result pauses
# for operator approval via a durable RequestInput interrupt.
hitl:
  require_approval: true

# Supervisor-body planner (docs/orchestration-design.md "The planner",
# v0.1 scaffold). When enabled, the root agent becomes a Task-mode
# planner whose invoke_specialist roster is the specialists list above,
# and --dispatch is ignored. run_shape_* vocabulary tools are declared
# but return not_implemented until v0.2 wires the reference-graph
# library.
# planner:
#   enabled: true

edge_trigger:
  http:
    path: /inject
    auth: bearer
