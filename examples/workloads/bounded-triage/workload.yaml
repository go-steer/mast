#
# Bounded-path anchor workload: one incident in, one report out, one
# model call spent.
# See docs (in the mast repo): v0.4-plan.md (W4.3).
#
# Why this is a separate bundle from gke-triage rather than another
# --dispatch on it: gke-triage's roster is fourteen specialists and a
# router, and `bounded` refuses a roster it would have to choose
# within — the chooser is the orchestrator this shape exists to remove.
# The two bundles answer different questions about the same incident.
# gke-triage asks "what is wrong and what should we do about it",
# spends a router call plus a specialist tool loop, and can change the
# cluster. This one asks "what does the envelope alone say", spends
# exactly one call, and cannot change anything. Point a scheduler at
# this one when you want a standing signal whose monthly cost is
# multiplication rather than a guess.

name: bounded-triage
description: One-call triage of a GKE incident envelope — a single SingleTurn specialist, a report forced to the finding schema, no orchestrator.
mode: single_session

dispatch: bounded

# No tool_catalog. The bounded shape builds one SingleTurn specialist,
# and a SingleTurn specialist is handed no toolsets — that is what makes
# the call count a constant, and it is also why ADK can put the report
# schema on the request itself (Config.ResponseSchema) instead of
# hanging it off a finish_task declaration. The consequence to read on
# purpose: this workload has no write surface at all, so the report's
# `proposed_change` list is always empty. A diagnosis that needs a hand
# on the cluster is gke-triage's job, and the report says so in prose.

specialists:
  - incident-report

budget:
  max_wallclock_seconds: 120

# No `hitl:` block. The write gate exists to park a mutation before it
# lands; this bundle can reach no mutating tool, so a gate here would
# park nothing and only add an operator round-trip to a cycle whose
# whole claim is that it finishes by itself.

edge_trigger:
  http:
    path: /inject
    auth: bearer
