# GoReleaser config for mast. Adapted from the go-steer/core-agent
# release setup, deliberately leaner for v0.1.x: cross-compiled
# binaries + checksums; Sigstore signing and container images are
# recorded follow-ups (see .github/workflows/release.yml header).
version: 2

project_name: mast

builds:
  - id: mast
    main: ./cmd/mast
    binary: mast
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.CommitDate}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: tarballs
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

release:
  # v0.1.0-pre, v0.2.0-rc.1 etc. are marked Pre-release automatically.
  prerelease: auto
  # Notes are composed from CHANGELOG.md by dev/release/notes.sh and
  # passed via --release-notes; disable goreleaser's own changelog.
  mode: replace

changelog:
  disable: true
