# GoReleaser config for mast. Adapted from the go-steer/core-agent
# release setup, deliberately leaner for v0.1.x: cross-compiled
# binaries + checksums, and — since #342 — a Sigstore signature over
# the checksum file. Container images remain a recorded follow-up
# (see .github/workflows/release.yml header).
version: 2

project_name: mast

builds:
  - id: mast
    main: ./cmd/mast
    binary: mast
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/go-steer/mast/internal/version.Version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.CommitDate}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: tarballs
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Sigstore keyless signature over checksums.txt, and only over
# checksums.txt: the checksum file already covers every tarball
# byte-for-byte, so one signature transitively covers the whole
# release and a verifier has one thing to check rather than four.
# `artifacts: all` would produce four more signatures that say
# nothing the first one does not.
#
# Keyless means there is no private key anywhere: cosign gets a
# short-lived certificate from Fulcio against the workflow's GitHub
# OIDC token, and the identity baked into that certificate is the
# workflow file and the ref it ran on. That is the thing a verifier
# pins — see docs/site/.../install.md. `output: true` keeps cosign's
# log in the job output, because a signing step that fails quietly
# is how a release ships unsigned.
signs:
  - cmd: cosign
    artifacts: checksum
    output: true
    certificate: '${artifact}.pem'
    args:
      - sign-blob
      - --yes
      - --output-certificate=${certificate}
      - --output-signature=${signature}
      - ${artifact}

release:
  # v0.1.0-pre, v0.2.0-rc.1 etc. are marked Pre-release automatically.
  prerelease: auto
  # Notes are composed from CHANGELOG.md by dev/release/notes.sh and
  # passed via --release-notes (see .github/workflows/release.yml).
  mode: replace

# Deliberately NOT `changelog: disable: true`, which is what this file
# said through v0.3.0 and why both v0.2.0 and v0.3.0 published with an
# empty release body. Loading the --release-notes file happens *inside*
# the changelog pipe's Run() — disabling the pipe skips the load too, so
# the notes were composed, logged, and dropped. Leaving the pipe enabled
# is what honours the flag: the file short-circuits Run() before any
# git-log changelog is generated or written, so nothing is generated here
# either. The knob does not mean what it reads like it means.
