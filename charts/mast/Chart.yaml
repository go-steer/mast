apiVersion: v2
name: mast
description: >-
  Unattended Kubernetes triage: a mast daemon that diagnoses cluster-wide
  and changes only the namespaces you name.
type: application

# version is the CHART version and appVersion is the mast version the
# chart defaults to deploying. They move together — dev/release/ stamps
# both from the release tag — but they are not the same claim: a chart
# fix with no mast change still bumps `version`.
#
# 0.0.0-dev is the in-tree placeholder. `helm package` in
# .github/workflows/release-images.yml overrides both with
# --version/--app-version, so an unreleased chart rendered from a
# checkout never claims to be a release.
version: 0.0.0-dev
appVersion: "0.9.0"

# Lineage: the templates here are the `deploy/` kustomize base this repo
# carried through v0.9, deleted 2026-09-20 when the chart replaced it
# (#342) — which was itself derived from
# go-steer/core-agent@c5efbb9e:examples/gke-troubleshoot-agent/deploy/.
# `git log -- deploy/` is the history of everything under templates/.

home: https://go-steer.github.io/mast/
sources:
  - https://github.com/go-steer/mast
keywords:
  - kubernetes
  - triage
  - agent
  - sre
annotations:
  artifacthub.io/license: Apache-2.0
