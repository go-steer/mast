{{- $root := . -}}
{{- range .Values.remediationNamespaces }}
---
# The write half of the daemon's RBAC mirror, once per namespace named
# in .Values.remediationNamespaces. Renders nothing when that list is
# empty, which is the default: a fresh install diagnoses the whole
# cluster and can change nothing.
#
# A Role, not a ClusterRole. The subject is fixed and the namespace is
# the operator's choice, so a namespace nobody listed is one mast cannot
# change — and the list is one place to read rather than N applies of
# the same directory with a different `sed`.
#
# The verbs are the API-server-side mirror of the workload's declared
# write surface — patch_k8s_resource, apply_k8s_manifest and
# delete_k8s_resource in files/workload.yaml. The mirror is deliberately
# NARROWER than the tools:
#
#   - apply_k8s_manifest can name any kind; this Role lets it create
#     only workload objects and ConfigMaps, in one namespace.
#   - nothing here can delete a Deployment/StatefulSet/DaemonSet.
#     Deleting a workload is not a remediation mast performs
#     unattended; the operator does it by hand.
#   - no secrets, no serviceaccounts, no rbac.authorization.k8s.io, no
#     namespaces, no nodes, and nothing cluster-scoped at all.
#
# That gap is the point. The write gate (pkg/approval) decides whether
# an operator approved a call; this Role decides what the cluster will
# accept even when they did. A call outside it fails at the API server
# with a Forbidden the specialist sees as a tool error.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "mast.writeRole" $root }}
  namespace: {{ . }}
  labels:
    app.kubernetes.io/name: mast
    app.kubernetes.io/component: daemon
    {{- include "mast.labels" $root | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # Undoing a bad deploy is a patch back to the previous pod template
  # (the server offers no rollback tool), and scaling writes the scale
  # subresource.
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale", "replicasets/scale"]
    verbs: ["get", "update", "patch"]
  # Deleting a pod is how a remediation restarts one. Creating pods
  # directly is not granted — workloads are changed through their
  # controller.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "update", "patch"]
---
# Binds that Role to a daemon living in a DIFFERENT namespace. The
# asymmetry is the grant.
#
# Both subjects again. Bind only the ServiceAccount and, under
# WRITE_SCOPE=namespaced, mast is read-only everywhere: measured on a
# live GKE cluster 2026-09-06 (#290), a patch in this very namespace
# came back `User "serviceAccount:...svc.id.goog[...]" cannot patch
# resource "deployments"`.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "mast.writeRole" $root }}
  namespace: {{ . }}
  labels:
    app.kubernetes.io/name: mast
    app.kubernetes.io/component: daemon
    {{- include "mast.labels" $root | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "mast.writeRole" $root }}
subjects:
  {{- include "mast.daemonSubjects" $root | nindent 2 }}
{{- end }}
