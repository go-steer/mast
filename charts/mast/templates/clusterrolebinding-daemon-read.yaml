# Binds the cluster-wide READ role to the daemon. The matching write
# grant is not here and is not cluster-scoped — see
# rolebinding-daemon-write.yaml, which renders nothing until
# .Values.remediationNamespaces names a namespace.
#
# TWO subjects, because mast reaches a cluster by two paths and they do
# not share a username. The mast.daemonSubjects helper carries both and
# explains why; the short version is that the GKE MCP path — the one the
# agent's tools actually take — arrives as an RBAC User, and a
# ServiceAccount subject does not match it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "mast.readRole" . }}
  labels:
    app.kubernetes.io/name: mast
    app.kubernetes.io/component: daemon
    {{- include "mast.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "mast.readRole" . }}
subjects:
  {{- include "mast.daemonSubjects" . | nindent 2 }}
