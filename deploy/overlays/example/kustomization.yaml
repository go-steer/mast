# Originally derived from
# go-steer/core-agent@c5efbb9e:examples/gke-troubleshoot-agent/deploy/overlays/example/kustomization.yaml.
#
# Example overlay. Copy to a new overlay directory and fill in the
# REPLACE_ME values for your project + cluster.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: ghcr.io/go-steer/mast
    newTag: spike-0
  - name: ghcr.io/go-steer/k8s-event-watcher
    newTag: "2.6.0"

# Override the base's GCP env values.
configMapGenerator:
  - name: mast-gcp-env
    behavior: merge
    literals:
      - GOOGLE_CLOUD_PROJECT=REPLACE_ME
      - GOOGLE_CLOUD_LOCATION=global

patches:
  - path: patch-watcher-cluster-name.yaml
    target:
      kind: Deployment
      name: k8s-event-watcher
