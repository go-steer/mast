# Originally derived from
# go-steer/core-agent@c5efbb9e:examples/gke-troubleshoot-agent/deploy/overlays/example/kustomization.yaml.
#
# Example overlay. Copy to a new overlay directory and fill in the
# REPLACE_ME values for your project + cluster.
#
# One REPLACE_ME lives outside this file and is easy to miss:
# deploy/base/15-clusterrolebinding-daemon-read.yaml carries
# REPLACE_ME_PROJECT in the RBAC subject for the GKE MCP path. Kustomize
# has no substitution for a subject name, so it is an edit or a sed on
# the rendered output — and until it is made, mast reads nothing over the
# path its tools use.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: ghcr.io/go-steer/mast
    newTag: spike-0
  - name: ghcr.io/go-steer/k8s-event-watcher
    newTag: "2.6.0"

# Override the base's GCP env values.
configMapGenerator:
  - name: mast-gcp-env
    behavior: merge
    literals:
      - GOOGLE_CLOUD_PROJECT=REPLACE_ME
      - GOOGLE_CLOUD_LOCATION=global

patches:
  - path: patch-watcher-cluster-name.yaml
    target:
      kind: Deployment
      name: k8s-event-watcher
