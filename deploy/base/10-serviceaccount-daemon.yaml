# Originally derived from
# go-steer/core-agent@c5efbb9e:examples/gke-troubleshoot-agent/deploy/base/10-serviceaccount-daemon.yaml.
#
# Uses Workload Identity Federation for GKE direct-binding (no GSA
# impersonation) — the KSA has no annotation; setup-wif.sh binds the
# required roles directly to its principal at:
#
#   principal://iam.googleapis.com/projects/<PROJECT_NUMBER>/locations/global/workloadIdentityPools/<PROJECT_ID>.svc.id.goog/subject/ns/mast-triage/sa/mast-daemon
#
# Required roles (bound by scripts/setup-wif.sh):
#   roles/aiplatform.user
#   roles/mcp.toolUser
#   roles/container.admin
#   roles/iam.serviceAccountUser (on the NODE service account)
#
# WARNING — read this before trusting the RBAC split. GKE authorizes a
# Kubernetes API call if EITHER IAM or Kubernetes RBAC allows it, and
# this workload reaches the cluster through the GKE MCP server
# (container.googleapis.com/mcp) as the principal above, not through
# the pod's KSA token. While roles/container.admin is bound, the IAM
# path alone permits every mutating call in every namespace, so the
# cluster-wide-read / namespaced-write split in
# 14-clusterrole-daemon-read.yaml + deploy/remediation-target/ is
# defense in depth for the in-cluster API path, NOT the enforcement
# boundary for the MCP path. Narrowing the IAM binding —
# `WRITE_SCOPE=namespaced ./scripts/setup-wif.sh`, which binds
# roles/container.viewer instead — is what makes the split load-bearing
# for both. That mode has not been verified against a live cluster (it
# depends on GKE mapping the WIF principal to an RBAC subject); the
# default stays as it was. See docs/deployment-design.md, "Cluster
# permissions".
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mast-daemon
  namespace: mast-triage
  labels:
    app.kubernetes.io/name: mast
    app.kubernetes.io/component: daemon
