# Originally derived from
# go-steer/core-agent@c5efbb9e:examples/gke-troubleshoot-agent/deploy/base/10-serviceaccount-daemon.yaml.
#
# Uses Workload Identity Federation for GKE direct-binding (no GSA
# impersonation) — the KSA has no annotation; setup-wif.sh binds the
# required roles directly to its principal at:
#
#   principal://iam.googleapis.com/projects/<PROJECT_NUMBER>/locations/global/workloadIdentityPools/<PROJECT_ID>.svc.id.goog/subject/ns/mast-triage/sa/mast-daemon
#
# Required roles (bound by scripts/setup-wif.sh):
#   roles/aiplatform.user
#   roles/mcp.toolUser
#   roles/container.viewer          (WRITE_SCOPE=namespaced, the default)
#     or roles/container.admin      (WRITE_SCOPE=cluster-admin)
#   roles/iam.serviceAccountUser (on the NODE service account)
#
# WHY THE READ-ONLY IAM ROLE IS THE DEFAULT. GKE authorizes a Kubernetes
# API call if EITHER IAM or Kubernetes RBAC allows it, and this workload
# reaches the cluster through the GKE MCP server
# (container.googleapis.com/mcp) as the principal above, not through the
# pod's KSA token. Bind roles/container.admin and the IAM path alone
# permits every mutating call in every namespace, which makes the
# cluster-wide-read / namespaced-write split in
# 14-clusterrole-daemon-read.yaml + deploy/remediation-target/ defense in
# depth for the in-cluster API path and NOT the enforcement boundary for
# the MCP path. roles/container.viewer carries no write verb and no
# container.secrets.*, so under the default every write mast makes comes
# from RBAC and stops where the RoleBinding stops.
#
# Verified against a live GKE cluster on 2026-09-06 (#290), which also
# turned up the thing that made the narrowing useless before: the MCP
# path does not arrive as this ServiceAccount. The API server names the
# WIF principal
#
#   serviceAccount:<PROJECT_ID>.svc.id.goog[mast-triage/mast-daemon]
#
# and treats it as an RBAC *User*. The bindings name both subjects for
# that reason — see 15-clusterrolebinding-daemon-read.yaml. Check a real
# deployment with `PROJECT_ID=... scripts/rbac-matrix.sh`, which runs the
# whole matrix against both usernames. See docs/deployment-design.md,
# "Cluster permissions".
#
# WARNING — WRITE_SCOPE=cluster-admin is still available and still means
# what it always did: mast can change any namespace regardless of the
# manifests here.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mast-daemon
  namespace: mast-triage
  labels:
    app.kubernetes.io/name: mast
    app.kubernetes.io/component: daemon
