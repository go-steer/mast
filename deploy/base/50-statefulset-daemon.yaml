#
# Originally derived from
# go-steer/core-agent@c5efbb9e:examples/gke-troubleshoot-agent/deploy/base/50-deployment-daemon.yaml.
#
# Durable by default (issue #40, decided 2026-07-30): a StatefulSet
# with a PVC at /var/lib/mast and --session-db, per the v0.1 GKE row in
# docs/deployment-design.md — a rescheduled bare-Deployment pod loses
# the SQLite DB, and with it durable pauses, abort markers, and
# shutdown interruption markers. Multi-instance (2-N replicas) is the
# v0.2 row and means Postgres, not a shared PVC.
#
# Simplified for the mast spike vs. the core-agent recipe:
#   - No users.json Secret + initContainer shuffle (single-bearer auth
#     via MAST_INJECT_TOKEN env from a Secret).
#   - No X-Asserted-Caller / proxy-identity / admin_identities config.
#   - No -c ambient-config plumbing — mast reads --workload=<dir>
#     directly; no config.json in the ConfigMap.
#   - No record_plan writable /plans emptyDir — mast has no plan artifact
#     writer yet.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mast
  namespace: mast-triage
  labels:
    app.kubernetes.io/name: mast
    app.kubernetes.io/component: daemon
  annotations:
    apphub.cloud.google.com/functional-type: "AGENT"
spec:
  replicas: 1
  # serviceName is a StatefulSet requirement; pointing it at the
  # existing ClusterIP service is fine at replicas: 1 (stable per-pod
  # DNS only matters for multi-instance, which is v0.2 + Postgres).
  # The default RollingUpdate strategy recreates the single pod
  # sequentially — delete-then-create, same effective semantics as the
  # old Deployment's Recreate, which the RWO volume requires.
  serviceName: mast
  selector:
    matchLabels:
      app.kubernetes.io/name: mast
      app.kubernetes.io/component: daemon
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mast
        app.kubernetes.io/component: daemon
    spec:
      serviceAccountName: mast-daemon
      # Sized against the shutdown drain bound: on SIGTERM the daemon
      # drains in-flight turns for up to the workload's
      # budget.max_wallclock_seconds (300 in config/workload.yaml; 30s
      # when no budget is set), pre-marking their sessions durably
      # before waiting — so even a SIGKILL at this deadline leaves the
      # interruption markers on disk. Keep this above the drain bound
      # plus teardown headroom; shrinking the budget lets you shrink
      # this. See docs/durable-execution-design.md, "Shutdown contract".
      terminationGracePeriodSeconds: 330
      # Standard-cluster gate — uncomment to pin onto GKE-metadata-server
      # nodes. Required for WIF on Standard; REJECTED on Autopilot
      # (Autopilot ships the metadata server universally). Leaving
      # commented is the Autopilot-safe default; overlay operators on
      # Standard uncomment it.
      #
      # nodeSelector:
      #   iam.gke.io/gke-metadata-server-enabled: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        # PVC writability for the non-root user: the volume is
        # group-owned by this GID at mount time.
        fsGroup: 65532
      containers:
        - name: mast
          image: ghcr.io/go-steer/mast:latest
          imagePullPolicy: IfNotPresent
          args:
            - "--workload=/workspace/workload"
            - "--model=gemini-2.5-flash"
            - "--listen=:7777"
            - "--session-db=/var/lib/mast/sessions.db"
            - "--log-level=info"
          env:
            - name: MAST_INJECT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mast-inject-token
                  key: token
          envFrom:
            # GCP project + location for the Vertex AI client. Expected
            # keys: GOOGLE_CLOUD_PROJECT, GOOGLE_CLOUD_LOCATION. Set via
            # the generated `mast-gcp-env` ConfigMap in the base
            # kustomization; overlays override the values.
            - configMapRef:
                name: mast-gcp-env
          ports:
            - name: inject
              containerPort: 7777
              protocol: TCP
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          volumeMounts:
            - name: workload
              mountPath: /workspace/workload
              readOnly: true
            - name: state
              mountPath: /var/lib/mast
          readinessProbe:
            # HTTP probe on GET / (mast's inject server serves 200 on
            # the health path unauthenticated) — safe to poll from the
            # kubelet without a bearer token.
            httpGet:
              path: /
              port: inject
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: inject
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        # The workload dir (workload.yaml + mcp.json + schemas/*.json +
        # specialists/*.tmpl) is projected from a flat ConfigMap;
        # ConfigMap keys can't contain "/", so the generator flattens
        # paths with "_" and items:.path reconstitutes the tree.
        #
        # Every specialist the ConfigMap carries must be listed here.
        # An items: list projects only what it names, so a roster entry
        # missing from this block is absent from the pod and its failure
        # mode routes to _fallback with no sign that a dedicated
        # specialist exists — a silent downgrade, not an error. The
        # schemas/ dir has the same property: `output_schema:` resolves
        # relative to the .tmpl, so a specialist projected without its
        # schema fails to load.
        - name: workload
          configMap:
            name: mast-workload
            items:
              - key: workload.yaml
                path: workload.yaml
              - key: mcp.json
                path: mcp.json
              - key: schemas_finding.json
                path: schemas/finding.json
              - key: specialists_triage-classifier.tmpl
                path: specialists/triage-classifier.tmpl
              - key: specialists_CrashLoopBackOff.tmpl
                path: specialists/CrashLoopBackOff.tmpl
              - key: specialists_ImagePullBackOff.tmpl
                path: specialists/ImagePullBackOff.tmpl
              - key: specialists_ErrImagePull.tmpl
                path: specialists/ErrImagePull.tmpl
              - key: specialists_OOMKilled.tmpl
                path: specialists/OOMKilled.tmpl
              - key: specialists_FailedMount.tmpl
                path: specialists/FailedMount.tmpl
              - key: specialists_FailedScheduling.tmpl
                path: specialists/FailedScheduling.tmpl
              - key: specialists_BackOff.tmpl
                path: specialists/BackOff.tmpl
              - key: specialists_Unhealthy.tmpl
                path: specialists/Unhealthy.tmpl
              - key: specialists_NetworkNotReady.tmpl
                path: specialists/NetworkNotReady.tmpl
              - key: specialists_NodeNotReady.tmpl
                path: specialists/NodeNotReady.tmpl
              - key: specialists_Evicted.tmpl
                path: specialists/Evicted.tmpl
              - key: specialists__fallback.tmpl
                path: specialists/_fallback.tmpl
  volumeClaimTemplates:
    # Session state: SQLite DB (sessions, durable pauses, abort +
    # interruption markers) plus room for growth. Uses the cluster's
    # default StorageClass; overlays can patch storageClassName.
    - metadata:
        name: state
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
