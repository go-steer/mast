#
# Base kustomization for a single-cluster mast-triage deployment.
# Overlays under deploy/overlays/example/ pin image tags and adjust
# per-environment values (cluster name, GCP project/location, image
# registry).
#
# Secrets are deliberately NOT in this base — operators must create
# them out-of-band (`kubectl -n mast-triage create secret ...`):
#   - mast-inject-token          (opaque; key=token)
#   - k8s-event-watcher-token    (opaque; key=token, same value as above)
#
# The two secrets must carry the SAME token — the watcher posts to the
# daemon with that bearer.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mast-triage

resources:
  - 00-namespace.yaml
  - 10-serviceaccount-daemon.yaml
  - 11-serviceaccount-watcher.yaml
  - 12-clusterrole-watcher.yaml
  - 13-clusterrolebinding-watcher.yaml
  # Cluster-wide READ for the daemon. Its write grant is namespaced and
  # deliberately not here — see deploy/remediation-target/.
  - 14-clusterrole-daemon-read.yaml
  - 15-clusterrolebinding-daemon-read.yaml
  - 50-statefulset-daemon.yaml
  - 51-deployment-watcher.yaml
  - 60-service.yaml

configMapGenerator:
  - name: mast-gcp-env
    literals:
      - GOOGLE_CLOUD_PROJECT=REPLACE_ME
      - GOOGLE_CLOUD_LOCATION=global
  # Workload artifacts are mirrored into config/ from the source-of-truth
  # under ../../examples/workloads/gke-triage/. Kustomize's file-source
  # security restriction requires files to sit at/below the kustomization
  # dir. Keep the two in sync (or symlink) if you edit examples.
  - name: mast-workload
    files:
      - workload.yaml=config/workload.yaml
      - mcp.json=config/mcp.json
      - schemas_finding.json=config/schemas/finding.json
      - schemas_change-report.json=config/schemas/change-report.json
      - specialists_triage-classifier.specialist.md=config/specialists/triage-classifier.specialist.md
      - specialists_CrashLoopBackOff.specialist.md=config/specialists/CrashLoopBackOff.specialist.md
      - specialists_ImagePullBackOff.specialist.md=config/specialists/ImagePullBackOff.specialist.md
      - specialists_ErrImagePull.specialist.md=config/specialists/ErrImagePull.specialist.md
      - specialists_OOMKilled.specialist.md=config/specialists/OOMKilled.specialist.md
      - specialists_FailedMount.specialist.md=config/specialists/FailedMount.specialist.md
      - specialists_FailedScheduling.specialist.md=config/specialists/FailedScheduling.specialist.md
      - specialists_BackOff.specialist.md=config/specialists/BackOff.specialist.md
      - specialists_Unhealthy.specialist.md=config/specialists/Unhealthy.specialist.md
      - specialists_NetworkNotReady.specialist.md=config/specialists/NetworkNotReady.specialist.md
      - specialists_NodeNotReady.specialist.md=config/specialists/NodeNotReady.specialist.md
      - specialists_Evicted.specialist.md=config/specialists/Evicted.specialist.md
      - specialists__fallback.specialist.md=config/specialists/_fallback.specialist.md
      - specialists_change-executor.specialist.md=config/specialists/change-executor.specialist.md

generatorOptions:
  # Overlays reference these ConfigMaps by stable name; disabling the
  # hash suffix means operators must `kubectl rollout restart` after
  # ConfigMap edits.
  #
  # Kept deliberately (#289): a hashed name would roll the daemon on
  # every apply, and this daemon holds in-flight turns that are spending
  # money, parked approvals waiting on a human, and armed cadences. The
  # cost is that an edit can land on disk and change nothing, so the
  # daemon logs a `workload config identity` line at startup and warns
  # when the mounted files stop matching it.
  #
  # The operator-facing version of this — the lines it logs, the restart
  # that fixes it, and the fact that a log line is the only surface — is
  # at https://go-steer.github.io/mast/install/#config-drift-diagnosed-not-reconciled
  # (#343). Keep the two in step; nobody installing mast reads this file.
  disableNameSuffixHash: true
