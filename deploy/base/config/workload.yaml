#
# Anchor workload for the mast v0.1 GKE triage demo.
# See docs (in the mast repo): triage-demo-plan.md.

name: gke-triage
description: Autonomous triage of GKE cluster incidents surfaced by k8s-event-watcher.
mode: single_session

tool_catalog:
  mcp:
    - server: gke

specialists:
  - triage-classifier
  - CrashLoopBackOff
  - ImagePullBackOff
  - ErrImagePull
  - OOMKilled
  - FailedMount
  - FailedScheduling
  - BackOff
  - Unhealthy
  - NetworkNotReady
  - NodeNotReady
  - Evicted
  - _fallback

budget:
  max_wallclock_seconds: 300

edge_trigger:
  http:
    path: /inject
    auth: bearer
