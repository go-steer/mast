# Prints which rates moved when a PR changes the go-steer/core-models pin.
#
# core-models carries mast's price table, so a bump there can reprice
# every call a workload makes and change what a max_cost_usd buys. The
# checks in ci.yml tell a reviewer the code still works; this tells them
# what it now charges. dependabot-automerge.yml refuses core-models
# bumps so a human reads this report before merging one.
#
# Informational, never gating: it passes whatever moved and fails only
# when it could not produce the report. The report is in the job log
# and the run's summary page. It does not comment on the PR, because a
# Dependabot-triggered pull_request run gets a read-only token, and the
# PRs that most need the report are Dependabot's.
name: pricing-diff

on:
  pull_request:
    paths:
      - go.mod

permissions:
  contents: read

jobs:
  rates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Rates moved by the core-models bump
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: dev/ci/pricing-diff.sh "$BASE_SHA" "$HEAD_SHA"
