# CI for mast. This workflow runs dev/ci/presubmits/all.sh — the same
# script operators run locally — so local presubmit == CI exactly
# (docs/fork-design.md P1.5; house rule #6). Don't add inline check
# steps here; add a script under dev/ci/presubmits/ instead.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Presubmits
        run: dev/ci/presubmits/all.sh
