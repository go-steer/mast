# CI for mast. Every step runs a script under dev/ci/presubmits/ — the
# same scripts dev/ci/presubmits/all.sh runs locally — so local
# presubmit == CI exactly (docs/fork-design.md P1.5; house rule #6).
# Don't add inline check steps here; add a script under
# dev/ci/presubmits/, wire it into a job below AND into all.sh's steps
# list. The split into parallel jobs (core-agent's ci.yml shape) buys
# wall-clock and per-check status granularity only — the scripts stay
# the single source of truth.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: dev/ci/presubmits/build.sh
      - name: Vet
        run: dev/ci/presubmits/vet.sh
      - name: Format
        run: dev/ci/presubmits/fmt.sh
      - name: Test (-race)
        run: dev/ci/presubmits/test.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Cache the compiled golangci-lint binary. Keep the key's version
      # in sync with GOLANGCI_LINT_VERSION in dev/tools/lint-go —
      # ensure_tool finds the cached binary on GOBIN and skips the
      # (slow, from-source) go install.
      - uses: actions/cache@v4
        with:
          path: ~/go/bin/golangci-lint
          key: ${{ runner.os }}-golangci-lint-v2.12.1
      - name: golangci-lint
        run: dev/ci/presubmits/lint.sh

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/cache@v4
        with:
          path: ~/go/bin/govulncheck
          key: ${{ runner.os }}-govulncheck
      - name: go mod tidy is clean
        run: dev/ci/presubmits/mod-tidy.sh
      - name: govulncheck
        run: dev/ci/presubmits/vuln.sh
      - name: slim-deps guarantee
        run: dev/ci/presubmits/slim-deps.sh

  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docs-lint
        run: dev/ci/presubmits/docs-lint.sh

  e2e:
    runs-on: ubuntu-latest
    # The harness drives a real daemon through drains and waits; bound the
    # job so a wedged turn fails fast instead of burning the 360-minute
    # GitHub default. The suite runs in well under a minute normally.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: e2e UAT harness
        run: dev/ci/presubmits/e2e.sh
