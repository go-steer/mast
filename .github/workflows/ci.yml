# CI for mast (P1.1 skeleton, adapted from the go-steer repo pattern).
# When dev/ci/presubmits/* land (P1.5), this workflow runs those same
# scripts so local presubmit == CI.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Format check
        run: test -z "$(gofmt -l cmd pkg examples 2>/dev/null)"
      - name: Test
        run: go test ./...
