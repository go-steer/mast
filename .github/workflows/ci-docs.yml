# CI for the docs site (docs/site — Astro + Starlight). Verification
# only, no deploy — deploy is docs.yml's job (landed 2026-07-27 when
# the repo went public).
#
# Runs `docs-site.sh check` = astro build + the internal-link verifier
# (scripts/verify-internal-links.py): a green astro build does NOT
# validate links, so the verifier catches dead targets and links
# missing the /mast deploy base before they 404 on Pages.
#
# The check goes through dev/tools/docs-site.sh so local == CI
# exactly (same philosophy as ci.yml running dev/ci/presubmits/all.sh).
# The site build is deliberately NOT a presubmit: Go contributors
# shouldn't need a Node toolchain.

name: ci-docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - 'dev/tools/docs-site.sh'
      - 'scripts/verify-internal-links.py'
      - '.github/workflows/ci-docs.yml'
  pull_request:
    paths:
      - 'docs/site/**'
      - 'dev/tools/docs-site.sh'
      - 'scripts/verify-internal-links.py'
      - '.github/workflows/ci-docs.yml'

concurrency:
  group: ci-docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Astro 7 requires Node >=22.12 (same pin as core-agent's docs.yml).
  # Keep in lockstep with NODE_MAJOR in dev/tools/docs-site.sh.
  NODE_VERSION: '22'

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: docs/site/package-lock.json

      - name: Build site + verify links
        run: dev/tools/docs-site.sh check
