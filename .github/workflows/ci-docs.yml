# CI for the docs site (docs/site — Astro + Starlight). Build ONLY, no
# deploy: the repo is private until the fork lands + sanity checks pass
# (AGENTS.md "Operational facts"), so publishing is deliberately
# deferred. When the repo goes public, the deploy lands as a separate
# GitHub Pages workflow mirroring core-agent's docs.yml pattern
# (configure-pages + upload-pages-artifact + deploy-pages), and
# astro.config.mjs grows its site/base pair.
#
# The build step goes through dev/tools/docs-site.sh so local == CI
# exactly (same philosophy as ci.yml running dev/ci/presubmits/all.sh).
# The site build is deliberately NOT a presubmit: Go contributors
# shouldn't need a Node toolchain.

name: ci-docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - 'dev/tools/docs-site.sh'
      - '.github/workflows/ci-docs.yml'
  pull_request:
    paths:
      - 'docs/site/**'
      - 'dev/tools/docs-site.sh'
      - '.github/workflows/ci-docs.yml'

concurrency:
  group: ci-docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Astro 7 requires Node >=22.12 (same pin as core-agent's docs.yml).
  # Keep in lockstep with NODE_MAJOR in dev/tools/docs-site.sh.
  NODE_VERSION: '22'

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: docs/site/package-lock.json

      - name: Build site
        run: dev/tools/docs-site.sh build
