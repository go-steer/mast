# Cuts the GitHub Release on every `v*` tag push (adapted from
# go-steer/core-agent's release.yml, leaner for v0.1.x):
#   - refuses to release a commit the O tier has not passed
#     (dev/release/require-outcome.sh) — the tier gates pull requests,
#     and this is what makes it gate the release
#   - runs the full presubmit suite first — a tag never ships red
#   - cross-compiles the mast binary (linux/darwin x amd64/arm64)
#     via GoReleaser, with SHA-256 checksums
#   - signs checksums.txt with Sigstore keyless (#342), and then
#     verifies the signature it published
#   - publishes the Release with notes drawn from CHANGELOG.md
#     (dev/release/notes.sh); pre-release suffixes (-pre, -rc.N)
#     are marked Pre-release automatically
#
# The O-tier gate runs on the dry run too, deliberately. A dry run's job
# is to answer "would the real tag work", and one that skipped the only
# gate that can refuse a release would answer a narrower question than
# the one being asked. Dispatched on `main`, it is a full rehearsal —
# which now includes signing and verifying, since a signing step that
# has never run is not evidence that signing works.
#
# Deliberate v0.1.x omissions vs core-agent, to add when warranted:
# container images (release-images.yml), retroactive-tag overlay
# machinery.
#
# Manual dry run: gh workflow run release.yml -f dry_run=true

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Cross-compile only; skip the GitHub Release publish. Uploads dist/ as a workflow artifact.'
        type: boolean
        default: false

permissions:
  contents: write
  # Reading the O tier's verdict for the commit being released.
  checks: read
  # cosign keyless: exchanged with Fulcio for a short-lived signing
  # certificate. No signing key is stored anywhere, which is the
  # point — there is no secret to rotate and none to leak.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # First, before anything expensive: a tag the O tier has not
      # passed is not a release. See the script's header for why this
      # is a check on the artifact rather than a branch-protection rule.
      - name: Require a green outcome tier
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dev/release/require-outcome.sh
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Presubmits
        run: dev/ci/presubmits/all.sh
      # Needed by .goreleaser.yaml's signs: block on both paths — the
      # dry run signs too, because a rehearsal that skips the step
      # cannot tell you the step works.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Compose release notes
        if: ${{ !inputs.dry_run && startsWith(github.ref, 'refs/tags/') }}
        run: dev/release/notes.sh "${GITHUB_REF_NAME}" > /tmp/release-notes.md && cat /tmp/release-notes.md
      - name: GoReleaser (publish)
        if: ${{ !inputs.dry_run && startsWith(github.ref, 'refs/tags/') }}
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean --release-notes /tmp/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the published notes are not empty
        if: ${{ !inputs.dry_run && startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Every release through v0.3.0 published with an empty body: the
        # notes were composed and passed to --release-notes, but GoReleaser
        # loads that file inside the changelog pipe, which .goreleaser.yaml
        # had disabled. The composed file being correct proved nothing —
        # only the published artifact does. So assert on the artifact.
        run: |
          body_len=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" --jq '.body | length')
          echo "published release body: ${body_len} chars"
          if [ "${body_len}" -lt 200 ]; then
            echo "::error::${GITHUB_REF_NAME} published with a ${body_len}-char body; the CHANGELOG notes did not reach the release." >&2
            exit 1
          fi
      # Same discipline as the notes check above, applied to the
      # signature: download what an outsider downloads and verify it
      # there. GoReleaser exiting 0 means cosign exited 0 on the
      # runner's filesystem — it says nothing about whether the .sig
      # and .pem reached the release, which is the only place anyone
      # will look for them.
      - name: Verify the published signature
        if: ${{ !inputs.dry_run && startsWith(github.ref, 'refs/tags/') }}
        run: dev/release/verify-signature.sh "${GITHUB_REF_NAME}"
      - name: GoReleaser (dry run)
        if: ${{ inputs.dry_run || !startsWith(github.ref, 'refs/tags/') }}
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean --skip=publish --snapshot
      # The dry run's half of the same check. Nothing is published, so
      # there is no download to make; what can still be proved is that
      # the signature covers the checksum file and carries this
      # workflow's identity at the ref it was dispatched from. The
      # identity differs from the tag path by construction
      # (refs/heads/<branch> rather than refs/tags/<tag>), which is
      # exactly why it is asserted here rather than assumed: a
      # rehearsal that accepted any identity would pass on a signature
      # made by someone else's workflow.
      - name: Verify the dry-run signature
        if: ${{ inputs.dry_run || !startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail
          cd dist
          cosign verify-blob checksums.txt \
            --signature checksums.txt.sig \
            --certificate checksums.txt.pem \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          sha256sum --check checksums.txt
          echo "dry run: checksums.txt signed and every artifact it names matches"
      - name: Upload dist (dry run)
        if: ${{ inputs.dry_run || !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
