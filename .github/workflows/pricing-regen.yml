name: pricing-regen

# Weekly + on-demand refresh of pkg/pricing/builtin.go from LiteLLM's
# catalog. Opens an auto-PR when the regenerated file differs from
# what's in main. Fixed branch name (bot/pricing-regen) so re-runs
# update the existing PR rather than stacking dupes.
#
# Why mast needs this and not just an occasional hand-edit: the table
# it maintains is the one that drifted silently in the parent project
# (go-steer/core-agent#259 — shipped rates 20-30x off), and mast
# inherited both the table and the drift. Between the fork and
# 2026-08-17 the built-in set went five weeks without a bump while
# three model families shipped; nothing failed, because a missing row
# degrades cost accounting to a flat estimate rather than erroring.
# This workflow guarantees at least one regen attempt per week without
# a human remembering.
#
# The generator lives in dev/regen-builtin-pricing/. Membership is a
# RULE, not a list — every chat-mode, tool-calling, priced,
# non-deprecated Gemini/Anthropic model in the catalog ships built-in —
# so a regen can add or remove models on its own, not just move rates.
# Adjust eligible() there to change what qualifies.

on:
  schedule:
    # Mondays at 09:00 UTC — off-hour, well before US working day.
    # Cron minute is 7 (not 0) to avoid the schedule-hour thundering
    # herd against GHA's minute-0 spike.
    - cron: '7 9 * * 1'
  workflow_dispatch:

# GITHUB_TOKEN is only used to check the repo out — the branch push and
# the PR both go through the go-steer-bot App token minted below, which
# carries its own contents+pull-requests write. Leaving the write grants
# here would be a standing permission nothing in this job spends.
permissions:
  contents: read

env:
  BRANCH: bot/pricing-regen

jobs:
  regen:
    name: regen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Short-circuit if nothing generated moved — rates, context
      # windows, or the set of models that qualifies. LiteLLM's catalog
      # shifts slowly; most weeks this workflow exits here.
      #
      # --check writes nothing and answers on stdout. Drift is NOT
      # signalled by exit status: `go run` collapses every non-zero
      # child status to 1, so a failed LiteLLM fetch would otherwise be
      # indistinguishable from a real price change. Any non-zero exit
      # here means the generator broke, and `set -e` fails the step.
      # The check also normalizes away UpdatedAt and the header date,
      # so an un-regenerated Monday is not itself drift — otherwise
      # this would open a no-op date-churn PR every week forever.
      #
      # --report reuses that same normalized comparison to write the PR
      # body's "What moved" section. It has to be produced HERE, before
      # the regen writes builtin.go, because afterwards the only record
      # of what the file used to say is in git.
      - name: Detect catalog drift
        id: drift
        run: |
          set -euo pipefail
          verdict="$(go run ./dev/regen-builtin-pricing --check --report="${RUNNER_TEMP}/moved.md")"
          case "$verdict" in
            drift=true|drift=false) echo "$verdict" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::unexpected --check output: ${verdict}"; exit 1 ;;
          esac

      - name: Regenerate builtin.go from LiteLLM
        if: steps.drift.outputs.drift == 'true'
        run: go run ./dev/regen-builtin-pricing

      # Pre-validate the regenerated file. If lint/tests fail on the new
      # output, we'd rather fail the workflow than open a bad PR. A
      # reviewer then sees the alert and either fixes the generator or
      # tightens eligible().
      #
      # This is load-bearing now that membership is a rule: a model that
      # newly qualifies arrives with no pkg/modeltier tier, and
      # pricing's TestBuiltinModelsKnownToCompanionTables fails here
      # rather than letting an unclassified model reach an operator with
      # its compaction threshold silently defaulting to the universal
      # 0.85. Only the two Go presubmits run — the full ladder (e2e,
      # evals, vuln) gates the PR on push, and re-running it here would
      # double a ten-minute job to catch nothing this diff can break.
      - name: Verify regen (lint + unit tests)
        if: steps.drift.outputs.drift == 'true'
        run: |
          dev/ci/presubmits/lint.sh
          dev/ci/presubmits/test.sh

      - name: Extract regen date for PR body
        if: steps.drift.outputs.drift == 'true'
        id: meta
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # The body is assembled here rather than inlined into the action's
      # `body:` because the middle of it is generated. Every regen
      # re-stamps UpdatedAt on every row, so the diff a reviewer opens is
      # mostly rows that did not move: 2026-08-19's regen touched 32 and
      # exactly one — gemini-3.6-flash, halved — was a real rate change,
      # with nothing in the PR to distinguish that from a week where
      # nothing moved at all. The generated section names the movers and
      # counts them, and says so explicitly when there are none, so an
      # empty "What moved" is a claim rather than an absence (#188).
      #
      # Heredocs are unindented relative to this block because YAML
      # strips the common prefix before bash sees it — the terminators
      # land at column 0.
      - name: Compose PR body
        if: steps.drift.outputs.drift == 'true'
        run: |
          set -euo pipefail
          body="${RUNNER_TEMP}/pr-body.md"
          cat > "$body" <<'HEAD'
          Automated pricing regen — LiteLLM's `model_prices_and_context_window.json` shifted since the last time `pkg/pricing/builtin.go` was regenerated.

          **Regen date**: ${{ steps.meta.outputs.date }}
          **Source**: https://raw.githubusercontent.com/BerriAI/litellm/main/model_prices_and_context_window.json
          **Membership rule**: `eligible()` in `dev/regen-builtin-pricing/main.go` (edit + re-run to change what qualifies)

          HEAD
          cat "${RUNNER_TEMP}/moved.md" >> "$body"
          cat >> "$body" <<'TAIL'

          ## Review checklist

          - [ ] **New and removed models are intentional.** Membership is a rule, not a list, so this diff can add or drop whole models — not just move numbers. For each added key: is it a real GA/preview id an operator would plausibly pin, or catalog noise that `eligible()` should be excluding? For each removed key: upstream deprecated it or pulled it, and nothing in-tree still names it (`git grep` the id — task-class defaults, example workloads, docs and UAT scripts all hardcode model ids).
          - [ ] Diff on `pkg/pricing/builtin.go` is confined to the two generated maps (no spurious formatting churn)
          - [ ] Any rate change that halves or doubles is real (spot-check the provider's public pricing page — LiteLLM has occasionally shipped bad entries). "What moved" above is the list to check; a row not named there did not change value.
          - [ ] Context-window changes in `builtinContextWindows` are real. These are what a compaction threshold is a fraction of: a window that grows makes compaction fire later, and an over-large one lets a session run past a limit the provider hard-fails on.
          - [ ] `UpdatedAt` dates on all entries are today
          - [ ] The workflow log's rejection report ("N Gemini/Anthropic entries rejected") lists nothing that should have been kept — a model can vanish from this table because upstream stopped publishing its price or window, not only because it was deprecated
          - [ ] A newly-added model that belongs in a tier default is promoted deliberately, not automatically. `pkg/taskclass.ModelForTier` names the LATEST model in each line (see the POLICY block on that function) and `TestModelForTier_ReturnsLatestInLine` fails this PR when a newer same-line model lands here — promote it in a follow-up once it has been UAT'd, don't ship an unexercised model as everyone's default.
          - [ ] A rate that moved ONTO a promotional number, or a promotional rate that failed to move OFF one, is recorded in `introductoryRates` (`pkg/pricing/introductory_rates_test.go`). LiteLLM publishes no expiry metadata, so a known end date only exists here if someone writes it down.

          ## Verification

          The two Go presubmits (`lint.sh`, `test.sh`) already ran green in this workflow before the PR opened. Full CI runs on push here.

          ## Manual regen

          ```
          go run ./dev/regen-builtin-pricing
          ```

          Context: the generator and this workflow are ports of the parent project's answer to go-steer/core-agent#259. Hand-authored builtin rates drifted 20-30x silently there before the generator + weekly PR existed.
          TAIL
          echo "--- composed PR body ---"
          cat "$body"

      # Authenticate as the go-steer-bot GitHub App rather than with
      # GITHUB_TOKEN. Two independent reasons, both fatal:
      #
      #   1. The go-steer org forbids GITHUB_TOKEN from creating pull
      #      requests, and a repo can't override an org-level denial.
      #   2. Pushes made with GITHUB_TOKEN never trigger workflow runs
      #      (GitHub's loop guard). main requires status checks, so a
      #      GITHUB_TOKEN-authored PR would sit unmergeable forever with
      #      every check stuck at "Expected".
      #
      # An App installation token is a distinct identity subject to
      # neither restriction, and it expires in ~1h so nothing
      # long-lived sits in the job. The client-id/private-key are
      # ORG-level secrets shared by every go-steer repo that needs the
      # bot, so there is nothing to configure here — but the app's
      # installation is repository_selection: selected, so mast has to
      # be in that selection. If it isn't, this step is where the
      # workflow fails, and the regen + verify steps above will already
      # have run, so the log still says whether the catalog moved.
      #
      # client-id, not app-id: the action deprecated app-id in favour of
      # client-id, and the two are DIFFERENT fields on the app, not one
      # renamed. App ID is the short sequential integer; Client ID is
      # the opaque "Iv23li…" string the app's other auth flows already
      # use, and it's what goes in the signed JWT's issuer claim.
      # Pointing client-id at an app-id fails auth.
      #
      # Deliberately NOT gated on drift. Most weeks there is none, so
      # gating it would leave the credentials unexercised until the one
      # run that actually needs them — and a rotated-out private key or
      # an app uninstalled from this repo would surface as a failure on
      # the day there is finally something to ship. Minting on every run
      # makes the weekly job a live credential check; the token costs
      # nothing and expires in ~1h whether or not it gets used.
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.GOSTEER_BOT_CLIENT_ID }}
          private-key: ${{ secrets.GOSTEER_BOT_PRIVATE_KEY }}

      # peter-evans/create-pull-request handles the branch/push/PR
      # lifecycle idempotently: if BRANCH already exists as an open PR,
      # it force-updates the branch and the PR head refreshes; if no
      # diff, it does nothing.
      #
      # author/committer are set explicitly because the action defaults
      # author to ${{ github.actor }} — on a schedule event that
      # resolves to a human, so the commit would carry a maintainer's
      # name on a diff they never saw. Attribute machine commits to the
      # machine. The trailing [bot] and the numeric id are both
      # load-bearing: that exact form is what GitHub links back to the
      # app's account.
      - name: Open / update auto-PR
        if: steps.drift.outputs.drift == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: ${{ env.BRANCH }}
          base: main
          author: 'go-steer-bot[bot] <317684643+go-steer-bot[bot]@users.noreply.github.com>'
          committer: 'go-steer-bot[bot] <317684643+go-steer-bot[bot]@users.noreply.github.com>'
          commit-message: |
            chore(pricing): regenerate builtin.go from LiteLLM (${{ steps.meta.outputs.date }})

            Automated regeneration by .github/workflows/pricing-regen.yml.
            Membership is a rule — adjust eligible() in
            dev/regen-builtin-pricing/main.go.
          title: 'chore(pricing): regenerate builtin.go from LiteLLM (${{ steps.meta.outputs.date }})'
          # body-path, not an inline body: the middle of it is
          # generated by --report above. See the compose step.
          body-path: ${{ runner.temp }}/pr-body.md
          # No `labels:` — mast's label set has no `pricing` /
          # `automated` pair yet (the parent project's does), and
          # labelling with one that doesn't exist is a failure mode
          # worth more than the filter is worth. Add the labels to the
          # repo first, then add them here.
          delete-branch: false
