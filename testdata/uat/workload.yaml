#
# Minimal fixture workload for the v0.2 end-to-end UAT harness
# (scripts/uat-v0.2.sh). Deliberately tiny: one coordinator, one worker
# specialist, two declared tool policies, no MCP — so the scripted JSONL
# stays short and the assertions stay legible. See docs/uat-v0.2-plan.md.

name: uat
description: Fixture workload for the mast v0.2 end-to-end UAT harness.
mode: single_session

tool_catalog:
  # No MCP server: this fixture declares tool *policies* only, so the UAT
  # stays credential-free and offline. The names below classify effects
  # for the recorded-effect outbox. mast now wires MCP servers by catalog
  # (mcp.json) over both HTTP and local stdio (#87), so the legs that
  # actually dispatch these tools can wire a stdio server via mcp.json —
  # see docs/uat-v0.2-plan.md "Blocking-tool prerequisite".
  tools:
    - name: read_status
      mutating: false
    - name: apply_change
      mutating: true

specialists:
  - uat-worker

budget:
  max_wallclock_seconds: 300

edge_trigger:
  http:
    path: /inject
    auth: bearer
