#
# Minimal fixture workload for the v0.2 end-to-end UAT harness
# (scripts/uat-v0.2.sh). Deliberately tiny: one coordinator, one worker
# specialist, and two declared tool policies. The tools are backed by a
# local stdio MCP blocker (see tool_catalog.mcp below); the blocking legs
# drive them with --model=toolactor. See docs/uat-v0.2-plan.md.

name: uat
description: Fixture workload for the mast v0.2 end-to-end UAT harness.
mode: single_session

tool_catalog:
  # A local, credential-free stdio MCP server (testdata/uat/blocker) supplies
  # the two REGISTERED tools the crash/drain/abort legs dispatch and block on
  # (docs/uat-v0.2-plan.md "Blocking-tool prerequisite"; wired generically via
  # mcp.json since #87). It is a no-op under --model=echo (wireMCPToolsets
  # skips the echo model), so the no-blocking-tool legs stay offline and cheap;
  # the blocking legs run under --model=toolactor, which drives these tools.
  # The tool *policies* below classify effects for the recorded-effect outbox:
  # apply_change is mutating (the ambiguous-effect leg), read_status read-only
  # (the auto-resume-repair leg).
  mcp:
    - server: uat-blocker
  tools:
    - name: read_status
      mutating: false
    - name: apply_change
      mutating: true

specialists:
  - uat-worker

budget:
  max_wallclock_seconds: 300

hitl:
  # mast's default is require_approval: an unattended workload that says
  # nothing about mutation does not get to write. This fixture says
  # something, because the v0.2 legs are about what happens to a mutating
  # call that is *executing* when the process dies, drains, or is aborted
  # — parking it before it fires would measure the write gate instead.
  # The gate's own legs (scripts/uat-v0.3.sh) run their own workload.
  on_mutation: apply

edge_trigger:
  http:
    path: /inject
    auth: bearer
